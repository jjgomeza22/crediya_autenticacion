server:
  port: ${PORT}
spring:
  application:
    name: "crediYaAutenticacion"
  devtools:
    add-properties: false
  profiles:
    include: null
  webflux:
    base-path: /api/v1
adapters:
  r2dbc:
    host: ${DB_HOST}
    port: ${DB_PORT}
    database: ${DB_DATABASE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: ${CONF_ORIGINS}
  allowed-paths: login,swagger,docs
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
routes:
  paths:
    users: /usuarios
    login: /login